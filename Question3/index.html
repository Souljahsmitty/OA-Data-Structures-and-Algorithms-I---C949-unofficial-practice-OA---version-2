        <h1>Question 3: Which data structure allows elements to be inserted and deleted from one end and provides no direct access to the other end?</h1>
        <div id="timer">Time Left: <span id="countdown">120:00</span></div>
        <form id="quizForm">
            <label><input type="radio" name="answer" value="A"> A) Queues allow insertion at the back and deletion from the front, following the First-In-First-Out (FIFO) principle.</label><br>
            <label><input type="radio" name="answer" value="B"> B) Stacks allow insertion and deletion from only one end, following the Last-In-First-Out (LIFO) principle, making them useful for backtracking operations.</label><br>
            <label><input type="radio" name="answer" value="C"> C) Linked lists allow elements to be inserted and deleted from multiple positions within the structure.</label><br>
            <label><input type="radio" name="answer" value="D"> D) Trees use a hierarchical structure and allow insertion and deletion at multiple levels, rather than restricting it to one end.</label><br>
