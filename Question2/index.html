        <form id="quizForm">
            <label><input type="radio" name="answer" value="A"> A) Stacks allow inserting and deleting elements only at one end, following the Last-In-First-Out (LIFO) principle.</label><br>

            <label><input type="radio" name="answer" value="D"> D) Trees use a hierarchical structure and do not provide direct insertion and deletion from both ends.</label><br>
